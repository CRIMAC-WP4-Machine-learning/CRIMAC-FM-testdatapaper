name: Weekly Repo Summary

on:
  schedule:
    # Runs every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows you to trigger it manually anytime

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so git log works

      - name: Generate Weekly Changelog
        run: |
          echo "## 🚀 Weekly Repository Summary" >> $GITHUB_STEP_SUMMARY
          echo "### 🗓️ Period: $(date -d '14 days ago' '+%Y-%m-%d') to $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📝 Recent Commits:" >> $GITHUB_STEP_SUMMARY
          
          # Get commits from the last 7 days and format as a markdown list
          git log --since "14 days ago" --graph --abbrev-commit --decorate --format=format:'%C(yellow)%an%C(reset) - %C(bold green)(%ar)%C(reset) %C(white)%s%C(reset) %C(reset)%C(auto)%d%C(reset)'  >> $GITHUB_STEP_SUMMARY || echo "* No commits found." >> $GITHUB_STEP_SUMMARY

  issue-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Run Issue Digest Action
        uses: nus-oss/GithubDigest@master
        with:
          timezone: "Oslo"
